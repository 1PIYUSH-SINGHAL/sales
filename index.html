<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Corrugated Box Calculator</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Inter, system-ui;
  background: #eef1f5;
  color: #1f2937;
}
.wrapper {
  max-width: 1200px;
  margin: 40px auto;
  padding: 0 20px;
}
h1 { font-size: 28px; font-weight: 700; margin-bottom: 20px; }
.grid { display: grid; grid-template-columns: 380px 1fr; gap: 24px; }
.card {
  background: #fff;
  border-radius: 14px;
  padding: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,.08);
}
label { font-size: 13px; font-weight: 500; margin-top: 10px; display: block; }
input, select {
  width: 100%;
  padding: 10px;
  margin-top: 6px;
  border-radius: 8px;
  border: 1px solid #d1d5db;
}
button {
  width: 100%;
  margin-top: 18px;
  padding: 14px;
  border-radius: 10px;
  border: none;
  background: #2563eb;
  color: #fff;
  font-weight: 600;
  cursor: pointer;
}
canvas {
  width: 100%;
  height: 420px;
  background: #fafafa;
  border-radius: 12px;
  border: 1px solid #e5e7eb;
}
.hidden { display: none; }
</style>
</head>

<body>
<div class="wrapper">
<h1>Corrugated Box Calculator</h1>

<div class="grid">
<div class="card">

<label>Length</label><input id="len">
<label>Breadth</label><input id="br">
<label>Height</label><input id="ht">

<label>Unit</label>
<select id="unit">
  <option value="mm">mm</option>
  <option value="cm">cm</option>
  <option value="inch">inch</option>
</select>

<label>Dimension</label>
<select id="dim">
  <option value="i">Inner</option>
  <option value="o">Outer</option>
</select>

<label>Ply</label>
<select id="ply">
  <option value="3">3 Ply</option>
  <option value="5">5 Ply</option>
</select>

<label>Brand</label><input id="brand">
<label>Customer</label><input id="customer">

<hr>

<div id="ply3">
<label>Top GSM</label><input id="gsm_t">
<label>Flute GSM</label><input id="gsm_f">
<label>Bottom GSM</label><input id="gsm_b">

<label>Top Paper</label>
<select id="pt"><option>kraft</option><option>virgin kraft</option><option>fbb</option><option>duplex</option></select>

<label>Flute Paper</label>
<select id="pf"><option>kraft</option><option>virgin kraft</option><option>fbb</option><option>duplex</option></select>

<label>Bottom Paper</label>
<select id="pb"><option>kraft</option><option>virgin kraft</option><option>fbb</option><option>duplex</option></select>

<label>Flute Type</label>
<select id="ft"><option>A</option><option>B</option><option>C</option><option>E</option></select>
</div>

<div id="ply5" class="hidden">
<label>Top GSM</label><input id="gsm_t5">
<label>Flute 1 GSM</label><input id="gsm_f1">
<label>Middle GSM</label><input id="gsm_m">
<label>Flute 2 GSM</label><input id="gsm_f2">
<label>Bottom GSM</label><input id="gsm_b5">

<label>Top Paper</label><select id="pt5"><option>kraft</option><option>virgin kraft</option><option>fbb</option><option>duplex</option></select>
<label>Flute 1 Paper</label><select id="pf1"><option>kraft</option><option>virgin kraft</option><option>fbb</option><option>duplex</option></select>
<label>Middle Paper</label><select id="pm"><option>kraft</option><option>virgin kraft</option><option>fbb</option><option>duplex</option></select>
<label>Flute 2 Paper</label><select id="pf2"><option>kraft</option><option>virgin kraft</option><option>fbb</option><option>duplex</option></select>
<label>Bottom Paper</label><select id="pb5"><option>kraft</option><option>virgin kraft</option><option>fbb</option><option>duplex</option></select>

<label>Flute 1 Type</label><select id="ft1"><option>A</option><option>B</option><option>C</option><option>E</option></select>
<label>Flute 2 Type</label><select id="ft2"><option>A</option><option>B</option><option>C</option><option>E</option></select>
</div>

<hr>
<h3>Rates</h3>
<div id="rates"></div>

<label>Wastage %</label><input id="w">
<label>Conversion Rate</label><input id="cr">

<button onclick="calculate()">Calculate</button>
<div id="out"></div>
<button onclick="downloadKLD()">Download KLD</button>

</div>

<div class="card">
<canvas id="canvas" width="1200" height="420"></canvas>
</div>

</div>
</div>

<script>
const $ = id => document.getElementById(id);
const num = v => isNaN(parseFloat(v)) ? 0 : parseFloat(v);

const flute = { A:1.5, B:1.37, C:1.45, E:1.27 };
const paperColor = {
  "kraft":"#b08953",
  "virgin kraft":"#d4a017",
  "fbb":"#f5f6f2",
  "duplex":"#e6e2d6"
};

$("ply").onchange = () => {
  $("ply3").classList.toggle("hidden", $("ply").value==="5");
  $("ply5").classList.toggle("hidden", $("ply").value==="3");
  renderRates();
};

function papers(){
  return $("ply").value==="3"
    ? [pt.value,pf.value,pb.value]
    : [pt5.value,pf1.value,pm.value,pf2.value,pb5.value];
}

function renderRates(){
  rates.innerHTML="";
  [...new Set(papers())].forEach(p=>{
    const id = p.replace(/\s+/g,"_");
    rates.innerHTML+=`<label>${p.toUpperCase()} Rate</label><input id="rate_${id}">`;
  });
}

function rate(p){
  return num($("rate_"+p.replace(/\s+/g,"_"))?.value);
}

function calculate(){
  let L=num(len.value), W=num(br.value), H=num(ht.value);
  if(unit.value==="cm"){L*=10;W*=10;H*=10;}
  if(unit.value==="inch"){L*=25.4;W*=25.4;H*=25.4;}
  if(dim.value==="i"){const a=ply.value==="3"?5:8;L+=a;W+=a;H+=a;}

  const area=((W+H)*(2*(L+W)+40))/1e6;
  let totalW=0,totalP=0;

  if(ply.value==="3"){
    const wtT=(num(gsm_t.value)*area)/1000;
    const wtF=(num(gsm_f.value)*area*flute[ft.value])/1000;
    const wtB=(num(gsm_b.value)*area)/1000;
    totalW=wtT+wtF+wtB;
    totalP=wtT*rate(pt.value)+wtF*rate(pf.value)+wtB*rate(pb.value);
    draw(L,W,H,pt.value);
  } else {
    const wtT=(num(gsm_t5.value)*area)/1000;
    const wtF1=(num(gsm_f1.value)*area*flute[ft1.value])/1000;
    const wtM=(num(gsm_m.value)*area)/1000;
    const wtF2=(num(gsm_f2.value)*area*flute[ft2.value])/1000;
    const wtB=(num(gsm_b5.value)*area)/1000;
    totalW=wtT+wtF1+wtM+wtF2+wtB;
    totalP=wtT*rate(pt5.value)+wtF1*rate(pf1.value)+wtM*rate(pm.value)+wtF2*rate(pf2.value)+wtB*rate(pb5.value);
    draw(L,W,H,pt5.value);
  }

  totalP=totalP*(1+num(w.value)/100)+num(cr.value)*totalW;
  out.innerHTML=`\nTotal Price: Rs. ${totalP.toFixed(2)}<br>Weight: ${(totalW*960).toFixed(2)} g`;
}

function draw(L,W,H,p){
  const ctx=canvas.getContext("2d");
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle=paperColor[p]||"#ddd";
  ctx.fillRect(100,100,canvas.width-200,canvas.height-200);
}

function downloadKLD(){
  const a=document.createElement("a");
  a.href=canvas.toDataURL();
  a.download="kld.png";
  a.click();
}

renderRates();
</script>

</body>
</html>
